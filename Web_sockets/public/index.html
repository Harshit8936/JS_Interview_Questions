<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
</head>
<body>
    <h1>Chatting</h1>
    <input type="text" name="message" id="message" placeholder="Enter message">
    <button id="sendBtn">Send</button>
    <div id="messages"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();    // to create a connection
        const sendBtn = document.getElementById("sendBtn");
        const messageInput = document.getElementById("message");
        const allMesaages = document.getElementById("messages");
        socket.on('message',message=>
            {
                const p = document.createElement('p');
                p.innerText = message;
                allMesaages.appendChild(p)
            }
            // console.log("New Mesage is",message)
        )
        sendBtn.addEventListener('click',(e)=>{
            const message = messageInput.value;
            socket.emit('user-message',message)        // to see message network->ws->click on that request-> message
        })
      </script>
</body>
</html>
